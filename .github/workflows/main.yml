name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Update version in pubspec.yaml
        run: |
          NEW_VERSION="1.0.${{ github.run_number }}+${{ github.run_number }}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

      - name: Restore keystore from secret
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/release.keystore
          echo "✅ Keystore restored"
          ls -la $HOME/release.keystore

      - name: Regenerate Android files
        run: |
          rm -rf android
          flutter create --platforms=android --org ye.sulieman --project-name debtbook .

          mkdir -p android/app/src/main/kotlin/ye/sulieman/debtbook
          cat > android/app/src/main/kotlin/ye/sulieman/debtbook/MainActivity.kt << 'KOTEOF'
          package ye.sulieman.debtbook

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          KOTEOF

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.USE_FINGERPRINT"/>
              <uses-permission android:name="android.permission.GET_ACCOUNTS"/>
              <application
                  android:label="دفتر الديون"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2"/>
              </application>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>
          </manifest>
          EOF

      - name: Configure Gradle
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          cat > android/settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/central' }
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }

          include ":app"
          EOF

          cat > android/build.gradle << 'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  maven { url 'https://maven.aliyun.com/repository/central' }
              }
          }

          rootProject.buildDir = "../build"

          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          // ═══════════════════════════════════════════════════════════
          // 🆕 إصلاح namespace — يجب أن يكون BEFORE evaluationDependsOn
          // ═══════════════════════════════════════════════════════════
          subprojects { subproject ->
              subproject.afterEvaluate {
                  if (subproject.hasProperty('android')) {
                      try {
                          def androidExt = subproject.android
                          def currentNs = null
                          try {
                              currentNs = androidExt.namespace
                          } catch (Exception e) {
                              currentNs = null
                          }

                          if (currentNs == null || currentNs.isEmpty()) {
                              def pkgName = null
                              def manifestFile = subproject.file('src/main/AndroidManifest.xml')
                              if (manifestFile.exists()) {
                                  def matcher = manifestFile.text =~ /package\s*=\s*"([^"]+)"/
                                  if (matcher.find()) {
                                      pkgName = matcher.group(1)
                                  }
                              }

                              if (pkgName == null || pkgName.isEmpty()) {
                                  def grp = subproject.group?.toString() ?: ''
                                  if (grp.isEmpty() || grp == 'unspecified') {
                                      pkgName = "com.${subproject.name.replaceAll('[^a-zA-Z0-9]', '')}"
                                  } else {
                                      pkgName = grp
                                  }
                              }

                              androidExt.namespace = pkgName
                              println "✅ [Auto-Namespace] Set '${pkgName}' for :${subproject.name}"
                          }
                      } catch (Exception e) {
                          println "⚠️ [Auto-Namespace] Failed for :${subproject.name} — ${e.message}"
                      }
                  }
              }
          }

          // بعد كتلة namespace نضيف evaluationDependsOn
          subprojects {
              project.evaluationDependsOn(":app")
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

      - name: Upgrade Gradle wrapper
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          EOF

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$HOME/release.keystore
          EOF
          echo "✅ key.properties created"

      - name: Fix SDK versions and namespace
        run: |
          sed -i -E 's/^[[:space:]]*compileSdk.*$/        compileSdk = 35/' android/app/build.gradle
          sed -i -E 's/^[[:space:]]*targetSdk.*$/        targetSdk = 35/' android/app/build.gradle
          sed -i -E 's/^[[:space:]]*minSdk.*$/        minSdk = 23/' android/app/build.gradle
          sed -i 's/com\.example\.debt_voice_app/ye.sulieman.debtbook/g' android/app/build.gradle

          echo ""
          echo "=== After SDK fix ==="
          grep -E "compileSdk|targetSdk|minSdk|applicationId|namespace" android/app/build.gradle || true

      - name: Add signing config to build.gradle
        run: |
          python3 << 'PYEOF'
          import re

          gradle_file = 'android/app/build.gradle'

          with open(gradle_file, 'r') as f:
              content = f.read()

          plugins_match = re.search(r'plugins\s*\{.*?\n\}', content, re.DOTALL)
          if plugins_match:
              plugins_end = plugins_match.end()
              keystore_def = '''

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              content = content[:plugins_end] + keystore_def + content[plugins_end:]

          android_match = re.search(r'android\s*\{', content)
          if android_match:
              insert_at = android_match.end()
              signing_block = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              '''
              content = content[:insert_at] + signing_block + content[insert_at:]

          build_types_match = re.search(r'buildTypes\s*\{', content)
          if build_types_match:
              start = build_types_match.end()
              release_match = re.search(r'release\s*\{', content[start:])
              if release_match:
                  release_start = start + release_match.end()
                  depth = 1
                  i = release_start
                  while i < len(content) and depth > 0:
                      if content[i] == '{':
                          depth += 1
                      elif content[i] == '}':
                          depth -= 1
                      i += 1
                  signing_line = "\n            signingConfig signingConfigs.release\n        "
                  content = content[:i-1] + signing_line + content[i-1:]

          with open(gradle_file, 'w') as f:
              f.write(content)

          print("✅ Signing config added")
          PYEOF

          echo ""
          echo "=== modified build.gradle ==="
          cat android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          echo "=== Verifying APK signature ==="
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            keytool -printcert -jarfile $APK_PATH 2>&1 | grep -E "SHA1:|SHA-1:|SHA256:" || echo "No cert info"
          else
            echo "❌ APK not found at $APK_PATH"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debt-voice-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
