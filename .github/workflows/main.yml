name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/release.keystore \
            -storepass debtbook2026 \
            -alias debtkey \
            -keypass debtbook2026 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Debt Book,O=Sulieman,C=YE"
          
          echo ""
          echo "========================================="
          echo "KEYSTORE SHA-1:"
          echo "========================================="
          keytool -list -v \
            -keystore ~/release.keystore \
            -storepass debtbook2026 \
            -alias debtkey 2>&1 | grep -E "SHA1:|SHA-1:|SHA256:|SHA-256:"
          
          echo ""
          echo "========================================="
          echo "KEYSTORE BASE64 (Copy everything below):"
          echo "========================================="
          base64 -w 0 ~/release.keystore
          echo ""
          echo "========================================="
          echo "END OF BASE64"
          echo "========================================="
