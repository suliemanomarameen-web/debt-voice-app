name: debt_voice_app
description: "تطبيق تسجيل الديون بالصوت"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ============ الحزم الأساسية ============
  cupertino_icons: ^1.0.6

  # ============ قاعدة البيانات ============
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # ============ الصوت ============
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5

  # ============ PDF والتصدير ============
  pdf: ^3.10.7
  printing: ^5.11.1
  excel: ^4.0.2
  csv: ^5.1.1
  share_plus: ^7.2.1

  # ============ Google Drive والمزامنة ============
  google_sign_in: ^6.2.1
  googleapis: ^11.4.0
  googleapis_auth: ^1.4.1
  http: ^1.1.0

  # ============ الإشعارات ============
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.3

  # ============ واجهة المستخدم ============
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  image_picker: ^1.0.5
  url_launcher: ^6.2.2
  flutter_colorpicker: ^1.0.3
  fl_chart: ^0.66.0

  # ============ النسخ الاحتياطي ============


  # ============ الأمان ============
  crypto: ^3.0.3
  local_auth: ^2.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # ============ الأصول (Assets) ============
  assets:
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf

  # ============ الخطوط (Fonts) ============
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
